name: CI

# Copied from .claude/skills/code-quality/templates/ci.yml in UAMS-Web/uams-claude-skills, with
# the setup action in .github/actions/setup/action.yml. This repository is public, so the jobs
# run without a RUN_REMOTE_CI switch and the aggregate `CI` job is required by a ruleset.
#
# - PHP: the setup action installs 8.4, the version `composer.lock` resolves against
#   (`config.platform.php`). The 8.2 floor is checked by the `lint-floor` job, which parses
#   every shipped file on 8.2.
# - Dropped from the template: `mutate-ignore` and `mutate` (no mutation testing here) and the
#   pest job's skip-baseline checks (no baseline file).
# - Not yet here: `npm test`. The script is a placeholder that exits 1 until the coverage
#   ticket (UAMS-Web/UAMSWP-shortcodes-ui#30) makes it run real tests.
# - The download-archive check is its own workflow (download-archive.yml, added by
#   UAMS-Web/UAMSWP-shortcodes-ui#25), so it is not a job in this file and not in `CI`'s
#   `needs:`. The aggregate-needs check reads jobs within this file only.
#
# `CI` `needs:` every other job in this file, runs `if: always()`, and fails unless every needed
# job reports `success`. A ruleset requires `CI`, `Attribution footer` and `Closing keywords`
# and nothing per job, so a job is added by listing it in `CI`'s `needs:` and nothing else.
# Do not rename `CI`.

on:
  pull_request:
  push:
    branches: [master]
  # Lets the workflow be run on demand against a branch.
  workflow_dispatch:

# A new push to a pull request cancels that pull request's stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  composer-validate:
    name: Composer validate (composer.lock freshness)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      # Fails when composer.json and composer.lock have drifted apart.
      - run: composer validate --no-check-publish --no-check-all

  synced-files:
    name: Synced files (no hand-edited rules or skills)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file, when a synced rule or skill was edited by hand.
      - run: node .claude/skills/synced-files/scripts/check-synced-files.mjs

  no-emoji:
    name: No emoji in durable records
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the file, line and code point, when prose carries a banned glyph.
      - run: node .claude/skills/writing-comments/scripts/check-no-emoji.mjs

  aggregate-needs:
    name: Aggregate needs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Fails, naming the job, when a job is missing from the `needs:` list of `CI` or a
      # fixed required name is reported by no job. Allow-list: .github/aggregate-needs-allow.json.
      - run: node .claude/skills/code-quality/scripts/check-aggregate-needs.mjs

  lint-floor:
    name: Lint floor (PHP 8.2)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Parses every shipped PHP file on the PHP floor, so syntax newer than 8.2 fails here even
      # though the suite runs on 8.4. tests/ is left out for that reason.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Parse every shipped PHP file on PHP 8.2
        run: |
          set -o pipefail
          files=$(find . -name '*.php' -not -path './vendor/*' -not -path './tests/*' -not -path './node_modules/*' -not -path './.git/*' | sort)
          echo "Files to parse: $(printf '%s\n' "$files" | grep -c .)"
          test -n "$files"
          printf '%s\n' "$files" | xargs -n1 php -l

  pint:
    name: Pint
    needs: [composer-validate, synced-files]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:pint

  rector:
    name: Rector
    needs: [pint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test:refactor

  phpstan:
    name: PHPStan
    needs: [pint]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer stan

  pest:
    name: Pest
    needs: [rector, phpstan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: composer test

  # The one check a ruleset requires from this workflow. Keep `needs:` listing every other job
  # in the file; the aggregate-needs job fails the pull request when one is missing.
  ci:
    name: CI
    needs: [composer-validate, synced-files, no-emoji, aggregate-needs, lint-floor, pint, rector, phpstan, pest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a job that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
