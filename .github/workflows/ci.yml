name: CI

# The checks this plugin runs on every pull request, on pushes to master, and weekly on a schedule.
#
# The lint and unit chain is the shared one, `UAMS-Web/uams-ci-workflows`, called by the
# `checks` job. One definition serves every UAMS-Web repository, so this plugin does not
# carry a copy that drifts. The call switches on the two jobs only a plugin runs
# (`floor-lint`, `download-archive`), runs on Linux only, mutates the plugin source under `inc/`
# (a pull request and a push mutate only the PHP files they change), and runs the plugin's unit
# suite as `composer test:unit`. `phpcs` stays off: this plugin has no PHPCS configuration. The
# chain's own header lists every input and its default.
#
# The last job, `CI`, is the one check a ruleset requires from this workflow (with the two
# pull-request-body checks, `Attribution footer` and `Closing keywords`). It `needs:` the
# call, runs `if: always()`, and fails unless the call reports `success`: a `skipped` or
# `cancelled` call fails it. The call ends in a `Chain result` job that needs every job in
# the chain, so `checks` is `success` only when each of them succeeded. Adding a plain job
# here means adding it to the `needs:` list of `CI`; the `aggregate-needs` job in the chain
# fails the pull request when one is missing. Do not rename `CI`, and do not rename `checks`
# without changing `needs:` below.
#
# What the plugin carries for the call, because the called jobs check out this repository:
# `.github/actions/setup/action.yml`, the synced `.claude/skills` scripts (including
# `pest-testing`, which the chain's `pest` job runs), the Composer scripts `test:pint`,
# `test:refactor`, `stan` and `test:unit`, and `scripts/lint-floor.php`.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  # The full mutation pass: a scheduled run mutates everything `composer mutate` covers, which a
  # pull request never does, so it catches decay no pull request touches. Mondays at 07:00 UTC.
  schedule:
    - cron: '0 7 * * 1'

# A new push to a pull request cancels that pull request's stale run. Every other run gets a
# group of its own, keyed on the commit, so a later push never cancels it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The shared chain. Its checks report as `checks / <job name> (<operating system>)`.
  checks:
    # Pinned to a release tag of the shared chain, never a branch: a change to the chain reaches
    # this plugin only when the tag here moves. v0.9.0 is the first tag that carries the plugin inputs.
    uses: UAMS-Web/uams-ci-workflows/.github/workflows/ci.yml@v0.9.0
    with:
      linux-only: true
      mutate-paths: inc
      mutate-ignore-paths: inc
      floor-lint: true
      floor-lint-php: '8.2'
      download-archive: true
      download-archive-command: node .claude/skills/download-archive-check/check-download-archive.mjs
      pest-command: composer test:unit

  # A plain job beside the shared call: the chain has no JavaScript job. It is listed in the
  # `needs:` of `CI` below, as the header requires of every plain job.
  js:
    name: JavaScript and build tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Runs the listener and embed tests and builds the Sass and scripts in a scratch copy.
      - run: npm test

  # A plain job beside the shared call: the decision log must stay oldest-first with a blank line
  # above each entry heading. Listed in the `needs:` of `CI` below.
  decision-log:
    name: Decision log order
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Prints the entry count it read; exits 1 on a finding and 2 when it could not answer.
      - run: node .claude/skills/decision-log/scripts/check-decision-log-order.mjs

  # The one check a ruleset requires from this workflow. Keep `needs:` naming the call.
  ci:
    name: CI
    needs: [checks, js, decision-log]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # `skipped` and `cancelled` fail as well as `failure`: a call that did not run proved nothing.
      - name: Every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed job results: $RESULTS"
          # An empty list would run no iterations and pass having read nothing.
          if [ -z "$RESULTS" ]; then echo "::error::No needed job results to read"; exit 1; fi
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A needed job reported $result"
              exit 1
            fi
          done
