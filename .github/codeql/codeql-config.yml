name: UAMSWP shortcodes CodeQL configuration

# Vendored pdf.js is generated by the Gulp `pdfjs` task from the `pdfjs-dist` package and
# rewritten by every Dependabot bump of it. It is upstream code, not first-party, so a finding
# there is not ours to fix and returns with new line numbers on the next bump. Dependabot and
# the package's own advisories cover it. The first-party viewer in `assets/pdf-viewer/` stays
# scanned.
paths-ignore:
  - assets/lib/pdfjs
