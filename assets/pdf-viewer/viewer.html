<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF</title>
  <link rel="stylesheet" href="../lib/pdfjs/web/pdf_viewer.css">
  <link rel="stylesheet" href="viewer.css">
  <script src="viewer.mjs" type="module"></script>
</head>
<body>
  <div class="toolbar" role="toolbar" aria-label="PDF controls">
    <div class="group">
      <button type="button" id="previous" aria-label="Previous page" title="Previous page">&#9650;</button>
      <button type="button" id="next" aria-label="Next page" title="Next page">&#9660;</button>
      <label class="page">
        <span class="visually-hidden">Page number</span>
        <input type="number" id="pageNumber" min="1" value="1" inputmode="numeric" autocomplete="off">
      </label>
      <span class="count">of <span id="pageCount">&ndash;</span></span>
    </div>
    <div class="group">
      <button type="button" id="zoomOut" aria-label="Zoom out" title="Zoom out">&minus;</button>
      <button type="button" id="zoomIn" aria-label="Zoom in" title="Zoom in">+</button>
      <label>
        <span class="visually-hidden">Zoom</span>
        <select id="zoom">
          <option value="auto" selected>Automatic zoom</option>
          <option value="page-fit">Page fit</option>
          <option value="page-width">Page width</option>
          <option value="0.5">50%</option>
          <option value="0.75">75%</option>
          <option value="1">100%</option>
          <option value="1.25">125%</option>
          <option value="1.5">150%</option>
          <option value="2">200%</option>
        </select>
      </label>
    </div>
    <form class="group" id="find" role="search">
      <label>
        <span class="visually-hidden">Find in document</span>
        <input type="search" id="findInput" placeholder="Find in document" autocomplete="off">
      </label>
      <button type="button" id="findPrevious" aria-label="Previous match" title="Previous match">&#9650;</button>
      <button type="button" id="findNext" aria-label="Next match" title="Next match">&#9660;</button>
      <span id="findStatus" class="count" aria-live="polite"></span>
    </form>
    <div class="group">
      <a id="download" class="button" download>Download</a>
      <button type="button" id="print">Print</button>
    </div>
  </div>
  <div id="viewerContainer">
    <div id="viewer" class="pdfViewer"></div>
  </div>
  <p id="message" role="alert" hidden></p>
</body>
</html>
