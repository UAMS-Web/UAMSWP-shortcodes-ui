name: Lint floor

# Parses every shipped PHP file on the PHP floor (8.2), so syntax newer than the floor fails
# here even though the suite runs on the development PHP (tests/ is left out for that reason).
# The CI workflow takes this job over as one of its own jobs.

on:
  pull_request:
  push:
    branches: [master]

# Nothing at the workflow level; the one job states the scopes it needs.
permissions: {}

jobs:
  lint-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Parse every shipped PHP file on PHP 8.2
        run: |
          set -o pipefail
          files=$(find . -name '*.php' -not -path './vendor/*' -not -path './tests/*' -not -path './node_modules/*' -not -path './.git/*' | sort)
          echo "Files to parse: $(printf '%s\n' "$files" | grep -c .)"
          test -n "$files"
          printf '%s\n' "$files" | xargs -n1 php -l
